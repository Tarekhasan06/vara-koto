<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ভাড়া কত?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..125,400..700&family=Baloo+Da+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column like a ticket counter. A flag-green route board on top
   (the red disc is the swap button), paper tickets below, and the printed stair-step chart for each route. */
:root{
  --paper:#edf1ea; --card:#ffffff; --ink:#13241d; --muted:#586a61; --line:#cdd8cf;
  --green:#006a4e; --green-ink:#00553f; --green-soft:#dcebe2; --red:#d81f3c; --sun:#f0b400; --sun-ink:#4a3600;
  --board:#006a4e; --board-ink:#ffffff; --board-field:#00553f; --board-line:#2f8a70;
  --font-display:'Baloo Da 2','Anek Bangla','Noto Sans Bengali','Hind Siliguri','Nirmala UI','Vrinda',sans-serif;
  --font-body:'Anek Bangla','Noto Sans Bengali','Hind Siliguri','Nirmala UI','Vrinda',sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c1411; --card:#15211c; --ink:#e7efe9; --muted:#9bb0a5; --line:#2a3c33;
    --green:#45d3a0; --green-ink:#7be3bd; --green-soft:#17332a; --red:#ff5d73; --sun:#ffcf4a; --sun-ink:#2b2000;
    --board:#0a5a43; --board-ink:#f3fbf7; --board-field:#07412f; --board-line:#2b7f67;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1411; --card:#15211c; --ink:#e7efe9; --muted:#9bb0a5; --line:#2a3c33;
  --green:#45d3a0; --green-ink:#7be3bd; --green-soft:#17332a; --red:#ff5d73; --sun:#ffcf4a; --sun-ink:#2b2000;
  --board:#0a5a43; --board-ink:#f3fbf7; --board-field:#07412f; --board-line:#2b7f67;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5;
  font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--green-ink)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 56px}

/* masthead */
.mast{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding:22px 0 14px}
.nav{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.langs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:0;background:transparent;color:var(--muted);padding:3px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.brand{display:flex;flex-direction:column;gap:0;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--font-display);font-weight:800;font-size:44px;line-height:1.05;letter-spacing:-.5px}
.brand b i{font-style:normal;color:var(--red)}
.brand span{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs a{padding:7px 16px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;white-space:nowrap}
.tabs a[aria-current="page"]{background:var(--green-soft);color:var(--green-ink)}

/* route board */
.board{background:var(--board);color:var(--board-ink);border-radius:20px;padding:18px;display:grid;gap:14px;
  box-shadow:0 10px 24px -14px rgba(0,60,40,.55)}
.fields{display:grid;grid-template-columns:1fr;gap:10px;position:relative}
.field{position:relative}
.field label{display:block;font-size:13.5px;font-weight:600;letter-spacing:.2px;opacity:.85;margin:0 0 4px 4px}
.field input{width:100%;background:var(--board-field);border:1.5px solid var(--board-line);color:var(--board-ink);
  border-radius:12px;padding:12px 44px 12px 14px;font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.25}
.field input::placeholder{color:var(--board-ink);opacity:.5;font-weight:600}
.field input:focus{outline:3px solid var(--sun);outline-offset:1px}
.clear{position:absolute;right:6px;bottom:7px;width:36px;height:36px;border:0;border-radius:50%;background:transparent;
  color:var(--board-ink);opacity:.7;cursor:pointer;display:grid;place-items:center}
.clear:hover{opacity:1;background:rgba(255,255,255,.12)}
.swap{position:absolute;right:16px;top:50%;transform:translateY(-22%);width:46px;height:46px;border-radius:50%;border:3px solid var(--board);
  background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center;z-index:2;transition:transform .2s}
.swap:hover{transform:translateY(-22%) rotate(180deg)}
.list{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:12px;max-height:300px;overflow:auto;box-shadow:0 18px 40px -18px rgba(0,0,0,.5);padding:6px}
.list[hidden]{display:none}
.opt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer}
.opt b{font-weight:600}
.opt small{color:var(--muted);font-size:13px;white-space:nowrap}
.opt em{font-style:normal;color:var(--muted);font-size:13px;margin-left:6px}
.opt[aria-selected="true"],.opt:hover{background:var(--green-soft)}
.none{padding:10px;color:var(--muted)}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who>span{font-size:14px;opacity:.85}
.seg{display:inline-flex;background:var(--board-field);border:1.5px solid var(--board-line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--board-ink);padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:15px;opacity:.8}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink);opacity:1}
.seg.plain{background:var(--card);border-color:var(--line)}
.seg.plain button{color:var(--ink)}
.seg.plain button[aria-pressed="true"]{color:var(--sun-ink)}

/* results */
h2{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.2;margin:26px 0 2px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 14px;font-size:15.5px}
.stack{display:grid;gap:12px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:1fr auto;position:relative;overflow:hidden}
.ticket .main{padding:14px 16px;min-width:0;display:grid;gap:6px}
.ticket .price{padding:14px 16px;border-left:2px dashed var(--line);display:flex;flex-direction:column;justify-content:center;align-items:flex-end;width:150px;position:relative}
.ticket .price::before,.ticket .price::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.ticket .price::before{top:-9px}.ticket .price::after{bottom:-9px}
.rno{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-display);font-weight:800;font-size:17px;color:var(--green-ink);
  background:var(--green-soft);padding:1px 10px;border-radius:6px;white-space:nowrap}
.rname{font-weight:600;overflow-wrap:anywhere}
.head{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.meta{color:var(--muted);font-size:15px}
.amt{font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1;color:var(--ink);white-space:nowrap}
.amt small{font-size:15px;font-weight:600;margin-left:3px;color:var(--muted);font-family:var(--font-body)}
.tag{background:var(--sun);color:var(--sun-ink);font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:999px;margin-bottom:6px}
.full{color:var(--muted);font-size:13.5px;margin-top:3px;text-align:right;white-space:nowrap}
.cap{color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:2px}
.orig{color:var(--ink);font-size:13.5px;font-weight:600;margin-top:5px;text-align:right;white-space:nowrap}
.minline{font-size:14px;opacity:.9;display:flex;align-items:center;gap:8px}
.minline::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sun);flex:none}
.best .price{background:var(--green-soft)}
.bestmark{color:var(--red);font-weight:700;font-size:13px}
details.way{font-size:15px}
details.way summary{cursor:pointer;color:var(--green-ink);font-weight:600;width:fit-content}
.path{list-style:none;margin:8px 0 2px;padding:0 0 0 4px;display:grid;gap:0}
.path li{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:3px 0;position:relative}
.path li::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--green);background:var(--card);justify-self:center;z-index:1}
.path li::after{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--line)}
.path li:first-child::after{top:50%}.path li:last-child::after{bottom:50%}
.path li.end::before{background:var(--green)}
.path li span:last-child{color:var(--muted);font-size:14px}
.leg{display:grid;gap:3px;padding:2px 0}
.change{display:flex;align-items:center;gap:8px;color:var(--red);font-weight:700;font-size:14.5px;margin:4px 0}
.change::before,.change::after{content:"";height:1px;background:var(--line);flex:1}
.note{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:15px}
.chip:hover{border-color:var(--green);color:var(--green-ink)}
.more{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600;color:var(--green-ink);justify-self:start}

/* route list + detail */
.filter{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px}
.rlist{display:grid;gap:8px;margin-top:14px}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;text-decoration:none;color:var(--ink)}
.rrow:hover{border-color:var(--green)}
.rrow .km{color:var(--muted);font-size:14px;white-space:nowrap;text-align:right}
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;margin-top:18px}
.calc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:12px;margin:14px 0}
.calc .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc label{display:block;font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.calc select{width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-size:17px}
.calc .out{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 8px}
.tools h3{font-family:var(--font-display);font-weight:800;font-size:21px;margin:0}
.chart{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:separate;border-spacing:0;font-size:14.5px;min-width:100%}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;text-align:right}
tr:last-child>*{border-bottom:0}
th.stop{position:sticky;left:0;background:var(--card);text-align:left;font-weight:600;z-index:1;max-width:44vw;overflow:hidden;text-overflow:ellipsis}
td.km{color:var(--muted)}
td.diag{text-align:left;font-weight:700;color:var(--green-ink);background:var(--green-soft);border-right:0}
td.blank{border:0;background:transparent}
thead th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--card)}
td.f{cursor:default}
td.f s{color:var(--muted);font-size:13px;margin-right:6px;text-decoration-thickness:1px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:grid;gap:6px}
.foot p{margin:0;max-width:65ch}
[hidden]{display:none!important}
@media (min-width:620px){
  .fields{grid-template-columns:1fr 1fr;gap:34px}
  .swap{right:auto;left:50%;top:auto;bottom:4px;transform:translateX(-50%)}
  .swap:hover{transform:translateX(-50%) rotate(180deg)}
}
@media (max-width:420px){
  body{font-size:16px}
  .brand b{font-size:38px}
  .ticket .price{width:136px;padding:12px}
  .amt{font-size:32px}
  .field input{font-size:20px}
}
@media (prefers-reduced-motion:no-preference){
  .stack>*{animation:in .28s ease both}
  @keyframes in{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
}

/* additions: bilingual list, letter groups, unlisted stops, bus names */
.opt .sec{font-style:normal;color:var(--muted);font-size:13.5px;margin-left:8px}
.grp{position:sticky;top:-6px;z-index:1;background:var(--card);color:var(--green-ink);font-family:var(--font-display);font-weight:800;font-size:15px;line-height:1.3;padding:6px 10px 2px;border-bottom:1px solid var(--line)}
.amt.range{font-size:27px}
.busline{font-size:14.5px;color:var(--muted)}
.busline b{color:var(--ink);font-weight:600}
.rbus{display:block;color:var(--muted);font-weight:400;font-size:13.5px}
.hint{font-size:14.5px;color:var(--muted);border-left:3px solid var(--sun);padding-left:10px;max-width:65ch}
p.hint{margin:0 0 4px}
.path li.un::before{border-style:dashed;background:var(--card)}
.path li.un span:first-child{color:var(--muted)}
@media (max-width:619px){ .nav{flex-direction:row;align-items:center;justify-content:space-between;width:100%;flex-wrap:wrap} }
@media (max-width:420px){ .amt.range{font-size:22px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <a class="brand" href="#khoj" id="brand"><b>ভাড়া কত<i>?</i></b><span data-t="tagline"></span></a>
    <div class="nav">
      <div class="langs" role="group" aria-label="ভাষা / Language">
        <button type="button" data-lang="bn" aria-pressed="true">বাংলা</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
      <nav class="tabs" aria-label="Pages">
        <a href="#khoj" id="tab-khoj" data-t="tabSearch"></a>
        <a href="#routes" id="tab-routes" data-t="tabRoutes"></a>
      </nav>
    </div>
  </header>

  <main>
    <section id="view-khoj">
      <form class="board" id="board" autocomplete="off">
        <div class="fields">
          <div class="field">
            <label for="from" data-t="from"></label>
            <input id="from" type="text" inputmode="text" data-tp="ph" role="combobox" aria-expanded="false" aria-controls="from-list" aria-autocomplete="list">
            <button type="button" class="clear" id="from-clear" data-ta="clear" hidden><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
            <div class="list" id="from-list" role="listbox" hidden></div>
          </div>
          <button type="button" class="swap" id="swap" data-ta="swap">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v15m0 0l-4-4m4 4l4-4M17 20V5m0 0l-4 4m4-4l4 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="field">
            <label for="to" data-t="to"></label>
            <input id="to" type="text" inputmode="text" data-tp="ph" role="combobox" aria-expanded="false" aria-controls="to-list" aria-autocomplete="list">
            <button type="button" class="clear" id="to-clear" data-ta="clear" hidden><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
            <div class="list" id="to-list" role="listbox" hidden></div>
          </div>
        </div>
        <div class="who">
          <span id="who-label" data-t="passenger"></span>
          <div class="seg" role="group" aria-labelledby="who-label">
            <button type="button" id="who-all" aria-pressed="true" data-t="general"></button>
            <button type="button" id="who-student" aria-pressed="false" data-t="student"></button>
          </div>
        </div>
        <div class="minline" data-t="minline"></div>
      </form>
      <div id="results"></div>
    </section>

    <section id="view-routes" hidden>
      <h2 data-t="tabRoutes"></h2>
      <p class="sub" id="routes-sub"></p>
      <label for="rfilter" class="sub" style="display:block;margin-bottom:6px" data-t="filterLabel"></label>
      <input class="filter" id="rfilter" type="text" data-tp="filterPh">
      <div class="rlist" id="rlist"></div>
    </section>

    <section id="view-route" hidden></section>
  </main>

  <footer class="foot">
    <p id="foot-src"></p>
    <p id="foot-min"></p>
    <p id="foot-note"></p>
    <p id="foot-count"></p>
  </footer>

function fare(r, i, j){ const a = Math.min(i, j), b = Math.max(i, j); return r.f[b][a]; }

function calcFare(r, i, j){ const d100 = Math.round(dist(r, i, j) * 100); return Math.floor((d100 * 27 + 500) / 1000); }

  if(chart <= MIN){ const c = calcFare(r, i, j); if(c < MIN) orig = Math.min(chart, c); }
  return {orig, pay: Math.max(MIN, chart)};
}
const add = (a, b) => ({orig: a.orig + b.orig, pay: a.pay + b.pay});

function direct(a, b){
  const out = [];
  for(const ri of through[a]){
    const r = R[ri], A = r.at.get(a), B = r.at.get(b); if(!B) continue;
    const km = Math.abs(A.km - B.km);
    if(A.c && B.c){ out.push({r: ri, a, b, km, exact: true, fare: fare(r, A.i, B.i), g: quote(r, A.i, B.i, false), s: quote(r, A.i, B.i, true)}); continue; }
    if(km < 0.05) continue;
    const [F, Z] = A.km < B.km ? [A, B] : [B, A];
    const inF = F.c ? F.i : F.hi, inZ = Z.c ? Z.i : Z.lo, outF = F.c ? F.i : F.lo, outZ = Z.c ? Z.i : Z.hi;
    const low = inF < inZ ? fare(r, inF, inZ) : 0, high = fare(r, outF, outZ);

function norm(s){
  return toAsc(s.normalize('NFC').toLowerCase()).replace(/[\s\-–—().,\/:&'’ঃ়ঁ]/g, '').replace(/ী/g, 'ি').replace(/ূ/g, 'ু').replace(/ণ/g, 'ন');

function skel(n){
  if(!/^[a-z0-9]+$/.test(n)) return '';

function findStops(q){
  const n = norm(q);
  if(!n) return stopIdx.map(s => ({s, rank: 0, via: ''})).sort(byName);
  const sk = skel(n), res = [];
  for(const s of stopIdx){
    let rank = 99, via = '';
    for(const k of s.keys){
      let v = k.n === n ? 0 : k.n.startsWith(n) ? 1 : k.n.includes(n) ? 2 : 99;

      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
      list.querySelectorAll('.opt').forEach((o, k) => o.setAttribute('aria-selected', String(k === active)));
      const el = $(key + '-o' + active); if(el) el.scrollIntoView({block: 'nearest'});
    }else if(e.key === 'Enter'){
      e.preventDefault(); const it = items[active >= 0 ? active : 0]; if(!list.hidden && it && norm(input.value)) pick(it.s.id);
    }else if(e.key === 'Escape'){ close(); }
  });
  input.addEventListener('blur', () => setTimeout(() => {
    close();
    if(!input.value.trim()){ if(state[key] != null){ state[key] = null; render(); } clear.hidden = true; return; }
    const exact = findStops(input.value)[0];
    if(exact && exact.rank < 1 && exact.s.id !== state[key]) pick(exact.s.id);
    else if(state[key] != null) input.value = sn(state[key]);
  }, 120));
  list.addEventListener('mousedown', e => e.preventDefault());
  list.addEventListener('click', e => { const o = e.target.closest('.opt'); if(o) pick(+o.dataset.id); });
  clear.addEventListener('click', () => { input.value = ''; state[key] = null; clear.hidden = true; render(); input.focus(); });
  return {set(){ input.value = state[key] != null ? sn(state[key]) : ''; clear.hidden = !input.value; }};
}
const cFrom = combo('from'), cTo = combo('to');
$('board').addEventListener('submit', e => e.preventDefault());
$('swap').addEventListener('click', () => { const x = state.from; state.from = state.to; state.to = x; cFrom.set(); cTo.set(); render(); });
function setStudent(v){ state.student = v; save(); syncWho(); render(); renderRoute(); }
function syncWho(){
  document.querySelectorAll('[data-who]').forEach(b => b.setAttribute('aria-pressed', String((b.dataset.who === 'student') === state.student)));
  $('who-all').setAttribute('aria-pressed', String(!state.student)); $('who-student').setAttribute('aria-pressed', String(state.student));
}
$('who-all').addEventListener('click', () => setStudent(false));
$('who-student').addEventListener('click', () => setStudent(true));

// ---------- rendering ----------
const cur = x => state.student ? x.s : x.g;
const amount = v => v.lo != null && v.lo !== v.hi ? `${fmt(v.lo)}–${fmt(v.hi)}` : fmt(v.pay);
function priceBox(x){
  const q = cur(x), o = state.student ? x.g : x.s, ranged = q.lo != null && q.lo !== q.hi;
  return (state.student ? `<span class="tag">${t('studentShort')}</span>` : '') +
    `<span class="cap">${t('pay')}</span><span class="amt${ranged ? ' range' : ''}">${amount(q)}<small>${t('taka')}</small></span>` +
    (x.exact === false ? `<span class="full">${t('byNeighbours')}</span>` : '') +
    (q.orig < q.pay ? `<span class="orig">${t('origFare', fmt(q.orig))}</span><span class="full">${t('minShort')}</span>` : '') +
    `<span class="full">${state.student ? t('fullFare', amount(o)) : t('studentFare', amount(o))}</span>`;
}
// every point of the ride, in travel order
function points(r, a, b){
  const A = r.at.get(a), B = r.at.get(b), lo = Math.min(A.km, B.km), hi = Math.max(A.km, B.km);
  const mid = [];
  r.s.forEach((s, p) => { if(s !== a && s !== b && r.kmn[p] > lo && r.kmn[p] < hi) mid.push({s, km: r.kmn[p], c: true}); });
  if(A.km > B.km) mid.reverse();
  return [{s: a, km: A.km, c: A.c}, ...mid, {s: b, km: B.km, c: B.c}];
}
function busLine(r){ const b = buses(r); return b.length ? `<div class="busline">${t('buses')}: <b>${esc(b.join(', '))}</b></div>` : ''; }
function legHtml(x, showFare){
  const r = R[x.r], pts = points(r, x.a, x.b), A = pts[0], B = pts[pts.length - 1], between = pts.length - 2;
  let f = '';
  if(showFare){ const q = quote(r, r.at.get(x.a).i, r.at.get(x.b).i, state.student); f = t('legFare', fmt(q.pay), q.orig < q.pay ? fmt(q.orig) : ''); }
  const hints = [A, B].filter(p => !p.c).map(p => { const at = r.at.get(p.s); return `<div class="hint">${esc(t('unlisted', sn(p.s), sn(r.s[at.lo]), sn(r.s[at.hi])))}</div>`; }).join('');
  const li = pts.map((p, k) => `<li class="${k === 0 || k === pts.length - 1 ? 'end' : ''}${p.c ? '' : ' un'}"><span>${esc(sn(p.s))}</span><span>${k === 0 ? t('boarding') : (p.c && A.c ? kmTxt(Math.abs(p.km - A.km)) : '≈ ' + num(Math.abs(p.km - A.km).toFixed(1))) + ' ' + t('km')}</span></li>`).join('');
  return `<div class="leg"><div class="head"><span class="rno">${esc(rno(r))}</span><span class="rname">${rname(r)}</span></div>${busLine(r)}
    <div class="meta">${esc(t('fromTo', sn(x.a), sn(x.b)))} · ${x.exact === false ? t('about') + ' ' + num(Math.abs(A.km - B.km).toFixed(1)) : kmTxt(Math.abs(A.km - B.km))} ${t('km')} · ${between > 0 ? t('between', between) : t('nextStop')}${f}</div>${hints}
    <details class="way"><summary>${t('pathStops')}</summary><ol class="path">${li}</ol><a href="#${r.hash}">${esc(t('fullChart', rno(r)))}</a></details></div>`;
}
function directCard(d, best){
  return `<article class="ticket${best ? ' best' : ''}"><div class="main">${legHtml(d, false)}</div><div class="price">${best ? `<span class="bestmark">${t('cheapest')}</span>` : ''}${priceBox(d)}</div></article>`;
}
function changeCard(c){
  return `<article class="ticket"><div class="main">${legHtml(c.l1, true)}<div class="change">${esc(t('changeAt', sn(c.mid)))}</div>${legHtml(c.l2, true)}</div><div class="price">${priceBox(c)}</div></article>`;
}
function routeRow(r){
  const b = buses(r);
  return `<a class="rrow" href="#${r.hash}"><span class="rno">${esc(rno(r))}</span><span class="rname">${rname(r)}${b.length ? `<small class="rbus">${esc(b.join(', '))}</small>` : ''}</span><span class="km">${t('rowMeta', kmTxt(r.kmn[r.kmn.length - 1]), r.s.length)}</span></a>`;
}
function render(){
  const el = $('results'), a = state.from, b = state.to;
  if(a == null && b == null){ el.innerHTML = `<h2>${t('emptyTitle')}</h2><p class="sub">${t('emptySub')}</p>`; return; }
  if(a == null || b == null){
    const s = a != null ? a : b, list = through[s];
    el.innerHTML = `<h2>${esc(t('throughTitle', sn(s), list.length))}</h2><p class="sub">${a != null ? t('needTo') : t('needFrom')}</p><div class="rlist">${list.map(x => routeRow(R[x])).join('')}</div>`;
    return;
  }
  if(a === b){ el.innerHTML = `<div class="note" style="margin-top:22px">${t('same')}</div>`; return; }
  const byPay = (u, v) => cur(u).pay - cur(v).pay || u.fare - v.fare || u.km - v.km;
  const all = direct(a, b), ex = all.filter(d => d.exact).sort(byPay), ap = all.filter(d => !d.exact).sort(byPay);
  const title = `<h2>${esc(t('fromTo', sn(a), sn(b)))}</h2>`;
  let html = title;
  if(all.length){
    let sub, lo = null, hi = null;
    if(ex.length){
      lo = cur(ex[0]).pay; hi = cur(ex[ex.length - 1]).pay;
      sub = t('directSub', all.length, fmt(lo), hi !== lo ? fmt(hi) : '', state.student) + (hi !== lo ? t('variesNote') : '') + (ex.some(x => cur(x).orig < cur(x).pay) ? t('minNote') : '');
    }else sub = t('directApprox', all.length);
    if(ap.length) sub += t('unlistedNote');
    html += `<p class="sub">${sub}</p><div class="stack">${ex.map(d => directCard(d, cur(d).pay === lo && hi !== lo)).join('')}${ap.map(d => directCard(d, false)).join('')}</div>`;
    if(state.showChange){
      const top = Math.max(...all.map(d => cur(d).pay));
      const cs = oneChange(a, b).sort(byPay).filter(c => cur(c).pay <= top * 1.6 + 10).slice(0, 5);
      html += cs.length ? `<h2>${t('changeTitle')}</h2><p class="sub">${t('changeSub')}</p><div class="stack">${cs.map(changeCard).join('')}</div>`
                        : `<div class="note" style="margin-top:16px">${t('noChange')}</div>`;
    }else html += `<div class="stack" style="margin-top:14px"><button class="more" id="show-change">${t('showChange')}</button></div>`;
  }else{
    const cs = oneChange(a, b).sort(byPay).slice(0, 8);
    html += cs.length ? `<p class="sub">${t('noDirect', fmt(cur(cs[0]).pay), state.student)}</p><div class="stack">${cs.map(changeCard).join('')}</div>`
                      : `<div class="note">${t('none', num(R.length))}</div>`;
  }
  el.innerHTML = html;
}
$('results').addEventListener('click', e => { if(e.target.id === 'show-change'){ state.showChange = true; render(); } });

const sortedRoutes = R.map((r, i) => i).sort((a, b) => (+R[a].noEn.replace(/\D/g, '')) - (+R[b].noEn.replace(/\D/g, '')));
const routeText = R.map(r => norm([r.no, r.noEn, r.frm, r.to, r.frmEn, r.toEn, ...r.bus, ...r.busEn, ...r.raw, ...r.s.map(s => S[s] + '|' + E[s])].join('|')));
function renderList(){
  const q = norm($('rfilter').value);
  const ids = sortedRoutes.filter(i => !q || routeText[i].includes(q));
  $('routes-sub').textContent = t('routesSub', num(R.length), num(S.length));
  $('rlist').innerHTML = ids.length ? ids.map(i => routeRow(R[i])).join('') : `<div class="note">${t('noMatch')}</div>`;
}
$('rfilter').addEventListener('input', renderList);

let curRoute = -1; const pickR = {i: 0, j: 0};
function renderRoute(){
  if(curRoute < 0) return;
  const r = R[curRoute], n = r.s.length, el = $('view-route');
  const label = p => lang === 'en' ? E[r.s[p]] : r.raw[p];
  const opts = sel => r.s.map((s, p) => `<option value="${p}"${p === sel ? ' selected' : ''}>${esc(sn(s))}</option>`).join('');
  let rows = '';
  for(let p = 0; p < n; p++){
    let tds = '';
    for(let q = 0; q < p; q++){ const c = quote(r, p, q, state.student); tds += `<td class="f" title="${esc(sn(r.s[q]))} → ${esc(sn(r.s[p]))}">${c.orig < c.pay ? '<s>' + fmt(c.orig) + '</s>' : ''}${fmt(c.pay)}</td>`; }
    tds += `<td class="diag">${esc(label(p))}</td>`;
    if(n - 1 - p > 0) tds += `<td class="blank" colspan="${n - 1 - p}"></td>`;
    rows += `<tr><th class="stop" scope="row">${esc(label(p))}</th><td class="km">${num(r.km[p])}</td>${tds}</tr>`;
  }
  const same = pickR.i === pickR.j, G = quote(r, pickR.i, pickR.j, false), Z = quote(r, pickR.i, pickR.j, true), Q = state.student ? Z : G;
  const note = lang === 'en' ? r.noteEn : r.note;
  el.innerHTML = `<a class="back" href="#routes">${t('back')}</a>
    <h2><span class="rno" style="font-size:22px;vertical-align:middle">${esc(rno(r))}</span> ${rname(r)}</h2>
    <p class="sub">${t('routeMeta', kmTxt(r.kmn[n - 1]), n, r.img)}</p>${busLine(r)}
    ${note ? `<div class="note" style="margin:10px 0 12px">${esc(note)}</div>` : ''}
    <div class="calc">
      <div class="row"><div><label for="r-from">${t('getOn')}</label><select id="r-from">${opts(pickR.i)}</select></div>
      <div><label for="r-to">${t('getOff')}</label><select id="r-to">${opts(pickR.j)}</select></div></div>
      <div class="out">${same ? `<span class="meta">${t('pickTwo')}</span>` :
        `<span class="meta">${t('calcLine', kmTxt(dist(r, pickR.i, pickR.j)), fmt(G.pay), fmt(Z.pay))}${Q.orig < Q.pay ? '<br>' + t('calcMin', fmt(Q.orig)) : ''}</span>
         <span class="amt">${fmt(Q.pay)}<small>${t('taka')}${state.student ? t('stTag') : ''}</small></span>`}</div>
    </div>
    ${r.x.length ? `<p class="hint">${t('alsoPasses')} ${r.x.map(x => esc(sn(x[0]))).join(', ')}</p>` : ''}
    <div class="tools"><h3>${t('chartTitle')}</h3>
      <div class="seg plain" role="group" aria-label="${t('passenger')}"><button type="button" data-who="all" aria-pressed="${!state.student}">${t('general')}</button><button type="button" data-who="student" aria-pressed="${state.student}">${t('studentShort')}</button></div></div>
    <div class="chart" tabindex="0" aria-label="${t('chartTitle')}"><table><thead><tr><th class="stop">${t('thStop')}</th><th>${t('km')}</th><th colspan="${n}" style="text-align:left">${t('thFare')}${state.student ? t('thSt') : ''}</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="sub" style="margin-top:8px">${t('chartHelp')}</p>`;
}
$('view-route').addEventListener('change', e => {
  if(e.target.id === 'r-from') pickR.i = +e.target.value; else if(e.target.id === 'r-to') pickR.j = +e.target.value; else return;
  renderRoute();
});
$('view-route').addEventListener('click', e => { const b = e.target.closest('[data-who]'); if(b) setStudent(b.dataset.who === 'student'); });

// ---------- language ----------
function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll('[data-tp]').forEach(el => el.placeholder = t(el.dataset.tp));
  document.querySelectorAll('[data-ta]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.ta)); el.title = t(el.dataset.ta); });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $('foot-src').innerHTML = t('footSrc'); $('foot-min').innerHTML = t('footMin'); $('foot-note').textContent = t('footNote');
  $('foot-count').textContent = t('footCount', num(R.length), num(S.length));
  cFrom.set(); cTo.set(); render(); renderList(); renderRoute();
}
document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; save(); applyLang(); }));

// ---------- views ----------
function route(){
  const h = (location.hash || '').replace('#', '');
  const isRoute = h in byHash, isList = h === 'routes';
  $('view-khoj').hidden = isRoute || isList; $('view-routes').hidden = !isList; $('view-route').hidden = !isRoute;
  $('tab-khoj').removeAttribute('aria-current'); $('tab-routes').removeAttribute('aria-current');
  (isRoute || isList ? $('tab-routes') : $('tab-khoj')).setAttribute('aria-current', 'page');
  if(isList) renderList();
  if(isRoute){
    const ri = byHash[h];
    if(ri !== curRoute){
      curRoute = ri; const r = R[ri];
      const a = r.s.indexOf(state.from), b = r.s.indexOf(state.to);
      pickR.i = a >= 0 ? a : 0; pickR.j = b >= 0 ? b : r.s.length - 1;
    }
    renderRoute(); window.scrollTo(0, 0);
  }
}
window.addEventListener('hashchange', route);

load(); syncWho(); applyLang(); route();
})();
</script>
</body>
